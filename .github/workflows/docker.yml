name: Build and Publish Docker Image

on:
  push:
    branches: [dev, v3.0, main]
  pull_request:
    branches: [dev, v3.0, main]
  release:
    types: [published]

# Two merges landing seconds apart each start a build, and whichever finishes
# last wins the :dev tag — which can leave it pointing at the older commit.
# Superseding runs on the same ref cancels the stale one so :dev always tracks
# the newest push. Releases are keyed by their own ref and aren't affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check uncovered modules
        run: |
          python -c "
          import py_compile, glob, sys
          errors = []
          for f in glob.glob('web/routers/*.py') + glob.glob('web/services/*.py'):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          "

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKERHUB_ENABLED == 'true' && format('{0}/plexcache-d', secrets.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository_owner }}/plexcache-d
          tags: |
            # dev tag for main/dev pushes (rolling test channel, tracks merged work)
            type=raw,value=dev,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
            # semver tags from the published release's tag (v3.2.0 -> 3.2.0, 3.2, 3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest only for full (non-prerelease) releases
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      # IMAGE_TAG is the sidebar badge (web/image_tag.py): pushes to main/dev
      # build :dev and show DEV, a full release shows none (the sidebar already
      # shows the version), and a pre-release like v3.4.0-beta1 shows BETA 1.
      - name: Compute IMAGE_TAG build arg
        id: image_tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != release ]]; then
            echo "value=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$PRERELEASE" == true ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          provenance: false
          sbom: false
          # Publish Docker v2 manifests rather than OCI. Unraid's update check
          # requests only Docker media types, so an OCI-only manifest returns 404
          # and the container reports "not available" instead of an update status.
          # provenance: false alone isn't enough — buildx still emits OCI types.
          outputs: type=image,oci-mediatypes=false,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.image_tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
